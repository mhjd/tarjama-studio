name: tarjama-isolated-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only
      POSTGRES_DB: tarjama_test
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d tarjama_test']
      interval: 2s
      timeout: 2s
      retries: 20
    cpus: 1
    mem_limit: 512m
    pids_limit: 100
  checks:
    image: tarjama-web-tools:test
    user: '${TEST_UID:-1001}:${TEST_GID:-1001}'
    init: true
    working_dir: /work/web/backend
    environment:
      MEDIA_TEST_ARTIFACTS: /work/web/.cache/media
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
      TEST_DATABASE_URL: postgres://test:test-only@db:5432/tarjama_test?sslmode=disable
      DATABASE_URL: postgres://test:test-only@db:5432/tarjama_test?sslmode=disable
      APP_MODE: test
      PUBLIC_ORIGIN: http://127.0.0.1:8090
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      STORAGE_DIR: /tmp/tarjama-storage
      FRONTEND_DIR: /work/web/frontend/dist
      GOCACHE: /work/web/.cache/build
      GOMODCACHE: /work/web/.cache/go
      npm_config_cache: /work/web/.cache/npm
    volumes:
      - ../..:/work
    tmpfs:
      - /tmp:size=4g,mode=1777,exec
    shm_size: 256m
    depends_on:
      db:
        condition: service_healthy
    networks: [test]
    cpus: 2
    mem_limit: 3g
    pids_limit: 256
    command: [sh, /work/web/scripts/checks.sh]
networks:
  test:
    internal: true
