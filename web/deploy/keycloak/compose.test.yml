name: tarjama-keycloak-test
services:
  appdb:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: test, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: tarjama}
    tmpfs: [/var/lib/postgresql/data:size=256m]
    networks: [isolated]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U test -d tarjama']
      interval: 2s
      timeout: 2s
      retries: 20
  authdb:
    image: postgres:17-alpine
    user: '70:70'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [postgres, -c, unix_socket_directories=/tmp, -c, shared_buffers=64MB, -c, max_connections=30]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synthetic-only
      POSTGRES_DB: postgres
      PGDATA: /data/pgdata
      PGSERVICE: keycloak-init
      PGSERVICEFILE: /configuration/pg_service.conf
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
      - ./pg_service.conf:/configuration/pg_service.conf:ro
      - ../../.cache/keycloak-test/secrets/db:/run/keycloak-db:ro
    tmpfs: ["/data:size=256m,uid=70,gid=70,mode=0700", "/tmp:size=64m,mode=1777"]
    networks: [isolated]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 2s
      retries: 20
  keycloak:
    image: tarjama-keycloak:review
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - ../../.cache/keycloak-test/tarjama-realm.json:/configuration/tarjama-realm.json:ro
      - ../../.cache/keycloak-test/secrets/db:/run/keycloak-db:ro
      - ../../.cache/keycloak-test/secrets/client:/run/keycloak-client:ro
      - ../../.cache/keycloak-test/secrets/bootstrap:/run/keycloak-bootstrap:ro
    environment:
      KC_HOSTNAME: http://localhost:8091
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_MANAGEMENT_HEALTH_ENABLED: 'false'
      KC_DB_URL: jdbc:postgresql://authdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      TARJAMA_PUBLIC_ORIGIN: http://localhost:8091
      TARJAMA_BACKCHANNEL_URL: http://localhost:8090/auth/backchannel-logout
    depends_on:
      authdb: {condition: service_healthy}
    networks: [isolated]
    cpus: 1
    mem_limit: 1536m
    pids_limit: 256
  checks:
    image: tarjama-web-tools:test
    user: '${TEST_UID:-1001}:${TEST_GID:-1001}'
    init: true
    network_mode: service:keycloak
    working_dir: /work/web/backend
    environment:
      APP_MODE: test
      PUBLIC_ORIGIN: http://localhost:8091
      LISTEN_ADDR: 127.0.0.1:8090
      DATABASE_URL: postgres://test:synthetic-only@appdb:5432/tarjama?sslmode=disable
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      OIDC_PROVIDER: keycloak
      OIDC_ISSUER: http://localhost:8091/realms/tarjama
      OIDC_CLIENT_ID: tarjama-web
      OIDC_CLIENT_SECRET: synthetic-only
      STORAGE_DIR: /tmp/storage
      FRONTEND_DIR: /work/web/frontend/dist
      GOCACHE: /work/web/.cache/build
      GOMODCACHE: /work/web/.cache/go
      npm_config_cache: /work/web/.cache/npm
      XDG_CONFIG_HOME: /tmp/chromium-config
      XDG_CACHE_HOME: /tmp/chromium-cache
    volumes: ['../../..:/work']
    tmpfs: ["/tmp:size=512m,mode=1777,exec"]
    shm_size: 256m
    depends_on:
      keycloak: {condition: service_started}
      appdb: {condition: service_healthy}
    cpus: 2
    mem_limit: 2g
    pids_limit: 256
    command: [sh, /work/web/keycloak-tests/checks.sh]
networks:
  isolated: {internal: true}
