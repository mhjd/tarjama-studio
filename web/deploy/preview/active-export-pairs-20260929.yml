    size: 1Gi
configs:
  postgres-client:
    pg_service.conf: '[preview-init]

      host=/tmp

      '
  deploy-backup:
    backup.sh: "#!/bin/sh\nset -eu\numask 077\nexport PGHOST=pv-db PGPORT=5432 PGDATABASE=tarjama\
      \ PGUSER=tarjama PGCONNECT_TIMEOUT=3\nexport PGPASSWORD=\"$(cat /run/db/app_db_password)\"\
      \nfor attempt in $(seq 1 30); do\n  if psql -X -w -Atqc 'SELECT 1' >/dev/null\
      \ 2>/tmp/db-ready.err; then break; fi\n  sleep 2\ndone\npsql -X -w -Atqc 'SELECT\
      \ 1' >/dev/null\nmkdir -p /storage/backups\nout=/storage/backups/pre-reliability-$(date\
      \ -u +%Y%m%dT%H%M%SZ).dump\nset -C\n: > \"$out\"\nset +C\npg_dump -w -Fc > \"\
      $out\"\npg_restore --list \"$out\" >/dev/null\nsha256sum \"$out\"\nprintf 'Backup\
      \ complete; no media modified.\\n'\n"
    identity-backup.sh: "#!/bin/sh\nset -eu\numask 077\nexport PGHOST=pv-authdb PGPORT=5432\
      \ PGDATABASE=keycloak PGUSER=keycloak PGCONNECT_TIMEOUT=3\nPGPASSWORD=$(cat\
      \ /run/keycloak-db/password)\nexport PGPASSWORD\nfor attempt in $(seq 1 30);\
      \ do\n  if psql -X -w -Atqc 'SELECT 1' >/dev/null 2>/tmp/authdb-ready.err; then\
      \ break; fi\n  sleep 2\ndone\npsql -X -w -Atqc 'SELECT 1' >/dev/null\nmkdir\
      \ -p /identity-backups/dumps\nout=/identity-backups/dumps/keycloak-$(date -u\
      \ +%Y%m%dT%H%M%SZ).dump\n# A failed dump is never published as a completed backup.\n\
      set -C\n: > \"$out.partial\"\nset +C\npg_dump -w -Fc > \"$out.partial\"\npg_restore\
      \ --list \"$out.partial\" >/dev/null\nmv \"$out.partial\" \"$out\"\nsha256sum\
      \ \"$out\"\nprintf 'Keycloak backup complete. Off-host copy and restore verification\
      \ still required.\\n'\n"
  keycloak-realm:
    tarjama-realm.json: "{\n  \"realm\": \"tarjama\",\n  \"displayName\": \"Tarjama\"\
      ,\n  \"enabled\": true,\n  \"sslRequired\": \"all\",\n  \"registrationAllowed\"\
      : true,\n  \"registrationEmailAsUsername\": true,\n  \"loginWithEmailAllowed\"\
      : true,\n  \"duplicateEmailsAllowed\": false,\n  \"verifyEmail\": false,\n \
      \ \"resetPasswordAllowed\": false,\n  \"editUsernameAllowed\": false,\n  \"\
      rememberMe\": false,\n  \"bruteForceProtected\": true,\n  \"permanentLockout\"\
      : false,\n  \"failureFactor\": 5,\n  \"waitIncrementSeconds\": 60,\n  \"maxFailureWaitSeconds\"\
      : 900,\n  \"ssoSessionIdleTimeout\": 86400,\n  \"ssoSessionMaxLifespan\": 86400,\n\
      \  \"accessTokenLifespan\": 300,\n  \"accessCodeLifespan\": 60,\n  \"accessCodeLifespanUserAction\"\
      : 600,\n  \"passwordPolicy\": \"length(12) and notUsername(undefined) and notEmail(undefined)\"\
      ,\n  \"internationalizationEnabled\": true,\n  \"supportedLocales\": [\n   \
      \ \"fr\",\n    \"en\"\n  ],\n  \"defaultLocale\": \"fr\",\n  \"clients\": [\n\
      \    {\n      \"clientId\": \"tarjama-web\",\n      \"name\": \"Tarjama\",\n\
      \      \"enabled\": true,\n      \"protocol\": \"openid-connect\",\n      \"\
      publicClient\": false,\n      \"clientAuthenticatorType\": \"client-secret\"\
      ,\n      \"secret\": \"${TARJAMA_OIDC_SECRET}\",\n      \"standardFlowEnabled\"\
      : true,\n      \"implicitFlowEnabled\": false,\n      \"directAccessGrantsEnabled\"\
      : false,\n      \"serviceAccountsEnabled\": false,\n      \"fullScopeAllowed\"\
      : false,\n      \"redirectUris\": [\n        \"${TARJAMA_PUBLIC_ORIGIN}/auth/callback\"\
      \n      ],\n      \"webOrigins\": [\n        \"${TARJAMA_PUBLIC_ORIGIN}\"\n\
      \      ],\n      \"defaultClientScopes\": [\n        \"profile\",\n        \"\
      email\"\n      ],\n      \"attributes\": {\n        \"pkce.code.challenge.method\"\
      : \"S256\",\n        \"post.logout.redirect.uris\": \"${TARJAMA_PUBLIC_ORIGIN}/\"\
      ,\n        \"backchannel.logout.url\": \"${TARJAMA_BACKCHANNEL_URL}\",\n   \
      \     \"backchannel.logout.session.required\": \"true\",\n        \"backchannel.logout.revoke.offline.tokens\"\
      : \"true\"\n      }\n    }\n  ],\n  \"requiredCredentials\": [\n    \"password\"\
      \n  ],\n  \"requiredActions\": [\n    {\n      \"alias\": \"UPDATE_PASSWORD\"\
      ,\n      \"name\": \"UPDATE_PASSWORD\",\n      \"providerId\": \"UPDATE_PASSWORD\"\
      ,\n      \"enabled\": true,\n      \"defaultAction\": false,\n      \"priority\"\
      : 0\n    },\n    {\n      \"alias\": \"UPDATE_PROFILE\",\n      \"name\": \"\
      UPDATE_PROFILE\",\n      \"providerId\": \"UPDATE_PROFILE\",\n      \"enabled\"\
      : false,\n      \"defaultAction\": false,\n      \"priority\": 1\n    },\n \
      \   {\n      \"alias\": \"VERIFY_PROFILE\",\n      \"name\": \"VERIFY_PROFILE\"\
      ,\n      \"providerId\": \"VERIFY_PROFILE\",\n      \"enabled\": false,\n  \
      \    \"defaultAction\": false,\n      \"priority\": 2\n    },\n    {\n     \
      \ \"alias\": \"VERIFY_EMAIL\",\n      \"name\": \"VERIFY_EMAIL\",\n      \"\
      providerId\": \"VERIFY_EMAIL\",\n      \"enabled\": false,\n      \"defaultAction\"\
      : false,\n      \"priority\": 3\n    }\n  ]\n}\n"
  keycloak-db-client:
    pg_service.conf: '[keycloak-init]

      host=/tmp

      '
  keycloak-db-init:
    10-keycloak.sh: '#!/bin/sh

      set -eu

      KC_DATABASE_PASSWORD=$(cat /run/keycloak-db/password)

      export KC_DATABASE_PASSWORD

      : "${KC_DATABASE_PASSWORD:?identity DB role password required}"

      # Runs only on the first start of this dedicated PostgreSQL volume.

      psql -X -v ON_ERROR_STOP=1 --host /tmp --username postgres --dbname postgres
      <<''SQL''

      \getenv role_password KC_DATABASE_PASSWORD

      CREATE ROLE keycloak LOGIN PASSWORD :''role_password'' NOSUPERUSER NOCREATEDB
      NOCREATEROLE;

      CREATE DATABASE keycloak OWNER keycloak;

      REVOKE ALL ON DATABASE keycloak FROM PUBLIC;

      SQL

      '
  requested-export:
    reexport.sql: "-- Explicit owner-requested one-shot export; no login/session or\
      \ project edits.\n-- Run only through the registered job, after backup. No automatic\
      \ rerun.\n\\set ON_ERROR_STOP on\nBEGIN;\nSET LOCAL lock_timeout = '5s';\nSET\
      \ LOCAL statement_timeout = '20s';\nCREATE TEMP TABLE requested_export_result(id\
      \ text) ON COMMIT PRESERVE ROWS;\nSELECT set_config('tarjama.project', :'project_id',\
      \ true);\nSELECT set_config('tarjama.url', :'expected_url', true);\nDO $body$\n\
      DECLARE\n p projects%ROWTYPE;\n j jobs%ROWTYPE;\n export_kind text;\n target_version\
      \ bigint;\n target_generation bigint;\n result_id text;\nBEGIN\n SELECT * INTO\
      \ STRICT p FROM projects WHERE id=current_setting('tarjama.project') FOR UPDATE;\n\
      \ IF p.document->>'url' IS DISTINCT FROM current_setting('tarjama.url') THEN\n\
      \  RAISE EXCEPTION 'Source does not match the owner request';\n END IF;\n IF\
      \ COALESCE((p.document->>'archived')::boolean,false) OR p.document->>'stage'\
      \ IS DISTINCT FROM 'ready'\n OR p.document->>'confirmed_review' IS DISTINCT\
      \ FROM p.document->>'version' THEN\n  RAISE EXCEPTION 'Project is not validated\
      \ for export';\n END IF;\n IF EXISTS(SELECT 1 FROM jobs WHERE project_id=p.id\
      \ AND state IN ('queued','running','waiting_provider')) THEN\n  RAISE EXCEPTION\
      \ 'Project already has an active treatment; no action taken';\n END IF;\n IF\
      \ COALESCE(p.document->>'media','')='' AND COALESCE((p.document->>'media_uploaded')::boolean,false)\
      \ THEN\n  RAISE EXCEPTION 'Original file must be reimported';\n END IF;\n IF\
      \ jsonb_array_length(p.document->'segments')=0 OR EXISTS(\n  SELECT 1 FROM jsonb_array_elements(p.document->'segments')\
      \ s WHERE trim(COALESCE(s->>'french',''))=''\n ) THEN RAISE EXCEPTION 'Incomplete\
      \ translation'; END IF;\n -- Keep the last French quality explicitly chosen\
      \ for this project.\n SELECT kind INTO STRICT export_kind FROM jobs\n WHERE\
      \ project_id=p.id AND owner_id=p.owner_id AND kind IN ('export_fr_low','export_fr_high')\n\
      \ ORDER BY created_at DESC LIMIT 1;\n target_version:=(p.document->>'version')::bigint;\n\
      \ target_generation:=(p.document->>'generation')::bigint;\n SELECT * INTO j\
      \ FROM jobs WHERE project_id=p.id AND kind=export_kind\n AND source_version=target_version\
      \ AND jobs.generation=target_generation FOR UPDATE;\n IF FOUND THEN\n  IF j.state\
      \ NOT IN ('succeeded','expired','failed','cancelled') THEN\n   RAISE EXCEPTION\
      \ 'Unexpected export state';\n  END IF;\n  UPDATE jobs SET state='queued',progress=0,message='',attempts=0,\n\
      \   media_attempt=media_attempt+1,input=p.document,lease='',lease_until=NULL,\n\
      \   next_attempt_at=now(),updated_at=now() WHERE id=j.id;\n  result_id:=j.id;\n\
      \ ELSE\n  result_id:=md5(random()::text || clock_timestamp()::text || p.id);\n\
      \  INSERT INTO jobs(id,project_id,owner_id,kind,source_version,generation,input)\n\
      \   VALUES(result_id,p.id,p.owner_id,export_kind,target_version,target_generation,p.document);\n\
      \ END IF;\n INSERT INTO requested_export_result VALUES(result_id);\n RAISE NOTICE\
      \ 'Owner requested export queued: job=% quality=% version=% generation=%',result_id,export_kind,target_version,target_generation;\n\
      END\n$body$;\nCOMMIT;\nSELECT 'RESULT_JOB=' || id FROM requested_export_result;\n"
    reexport.sh: "#!/bin/sh\nset -eu\nexport PGHOST=pv-db PGPORT=5432 PGDATABASE=tarjama\
      \ PGUSER=tarjama PGCONNECT_TIMEOUT=3\nPGPASSWORD=$(cat /run/db/app_db_password)\n\
      export PGPASSWORD\nfor attempt in $(seq 1 30); do\n  if psql -X -w -Atqc 'SELECT\
      \ 1' >/dev/null 2>/tmp/ready.err; then break; fi\n  sleep 2\ndone\nbefore=$(psql\
      \ -X -w -At -v ON_ERROR_STOP=1 -v project_id=\"$REQUESTED_PROJECT\" <<'SQL'\n\
      SELECT md5((document->'segments')::text) FROM projects WHERE id=:'project_id';\n\
      SQL\n)\nresult=$(psql -X -w -At -v ON_ERROR_STOP=1 -v project_id=\"$REQUESTED_PROJECT\"\
      \ -v expected_url=\"$EXPECTED_SOURCE_URL\" -f /configuration/reexport.sql)\n\
      printf '%s\\n' \"$result\"\njob=$(printf '%s\\n' \"$result\" | sed -n 's/^RESULT_JOB=//p')\n\
      case \"$job\" in ''|*[!a-f0-9]*) exit 1;; esac\nfor attempt in $(seq 1 90);\
      \ do\n  state=$(psql -X -w -At -v ON_ERROR_STOP=1 -v job_id=\"$job\" <<'SQL'\n\
      SELECT state FROM jobs WHERE id=:'job_id';\nSQL\n)\n  printf 'Export %s: %s\\\
      n' \"$job\" \"$state\"\n  case \"$state\" in\n    succeeded)\n      after=$(psql\
      \ -X -w -At -v ON_ERROR_STOP=1 -v project_id=\"$REQUESTED_PROJECT\" <<'SQL'\n\
      SELECT md5((document->'segments')::text) FROM projects WHERE id=:'project_id';\n\
      SQL\n)\n      test \"$before\" = \"$after\"\n      test -s \"/storage/$job.mp4\"\
      \n      printf 'Export complete; subtitle texts unchanged.\\n'\n      wc -c\
      \ \"/storage/$job.mp4\"\n      exit 0;;\n    failed|cancelled|expired|'') exit\
      \ 1;;\n  esac\n  sleep 30\ndone\nprintf 'Monitoring deadline reached; no automatic\
      \ rerun or cancellation.\\n'\nexit 124\n"
