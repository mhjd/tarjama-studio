# UI-only update from active-desktop-20260923.yml; qualified backend preserved.
# Phase: active. Applying this recipe starts services; jobs remain explicit.
version: 1
services:
  web:
    enabled: true
    image: "preview.local/atelier/web@sha256:e61811e1ad47e9b22164690c96ab3b362e37a48d135912ef5078af74101c202b"
    args: [api]
    uid: 10001
    gid: 10001
    port: 8090
    env:
      APP_MODE: production
      LISTEN_ADDR: 0.0.0.0:8090
      PUBLIC_ORIGIN: https://atelier.preview.runagen.com
      OIDC_ISSUER: "https://auth.runagen.com"
      OIDC_CLIENT_ID: "preview-atelier-tarjama"
      OIDC_CLIENT_SECRET_FILE: /run/oidc/client_secret
      DATABASE_URL_FILE: /run/db/database_url
      ENCRYPTION_KEY_FILE: /run/encryption/encryption_key
      STORAGE_DIR: /storage
      GOMAXPROCS: '1'
    secrets:
      - {name: tarjama-db-app, path: /run/db}
      - {name: tarjama-encryption, path: /run/encryption}
      - {name: tarjama-oidc, path: /run/oidc}
    volumes: [{name: library, path: /storage}]
    connect: [db]
    egress: ["oidc"]
    resources: {cpu: 500m, memory: 512Mi}
    tmp: 64Mi
    health: {path: /readyz}
  worker:
    enabled: true
    image: "preview.local/atelier/web@sha256:30eb294e540188a985f94f6de2a657681f20a7d5501b26dd0841eb485c19f2a9"
    args: [worker]
    uid: 10001
    gid: 10001
    env:
      APP_MODE: production
      PUBLIC_ORIGIN: https://atelier.preview.runagen.com
      DATABASE_URL_FILE: /run/db/database_url
      ENCRYPTION_KEY_FILE: /run/encryption/encryption_key
      GEMINI_API_KEY_FILE: /run/gemini/api_key
      GROQ_API_KEY_FILE: /run/groq/api_key
      MEDIA_ENGINE: isolated-jobs
      VPS_JOBS_URL: https://172.31.250.1:40002
      VPS_JOBS_TOKEN_FILE: /run/isolated-jobs/token
      VPS_JOBS_CA_FILE: /run/isolated-jobs/ca.crt
      STORAGE_DIR: /storage
      GOMAXPROCS: '1'
    secrets:
      - {name: tarjama-db-app, path: /run/db}
      - {name: tarjama-encryption, path: /run/encryption}
      - {name: tarjama-gemini, path: /run/gemini}
      - {name: tarjama-groq, path: /run/groq}
      - {name: isolated-jobs, path: /run/isolated-jobs}
    volumes: [{name: library, path: /storage}]
    connect: [db]
    egress: [public-web, isolated-jobs]
    resources: {cpu: 750m, memory: 768Mi}
    tmp: 64Mi
  egress:
    enabled: true
    image: "preview.local/atelier/web@sha256:30eb294e540188a985f94f6de2a657681f20a7d5501b26dd0841eb485c19f2a9"
    args: [egress]
    uid: 10003
    gid: 10003
    port: 8092
    env:
      LISTEN_ADDR: 0.0.0.0:8092
      WARP_HTTP_PROXY: "172.31.250.2:40001"
      GOMAXPROCS: '1'
    egress: ["warp-downloads"]
    resources: {cpu: 250m, memory: 128Mi}
    tmp: 16Mi
  db:
    enabled: true
    image: docker.io/library/postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    uid: 70
    gid: 70
    port: 5432
    args: [postgres, -c, unix_socket_directories=/tmp, -c, max_connections=40, -c, shared_buffers=128MB]
    env:
      POSTGRES_DB: tarjama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/db-admin/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
      PGDATA: /data/pgdata
      PGSERVICE: preview-init
      PGSERVICEFILE: /configuration/pg_service.conf
    secrets: [{name: tarjama-db-admin, path: /run/db-admin}]
    configs: [{name: postgres-client, path: /configuration}]
    volumes: [{name: database, path: /data}]
    resources: {cpu: 750m, memory: 768Mi}
    tmp: 64Mi
jobs:
  bootstrap-db:
    image: docker.io/library/postgres@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    uid: 70
    gid: 70
    command: [/bin/sh]
    args: [/configuration/bootstrap-db.sh]
    env:
      PGHOST: pv-db
      PGPORT: '5432'
      PGDATABASE: tarjama
      PGUSER: postgres
      PGPASSWORD: {secret: tarjama-db-admin, key: postgres_password}
      APP_DB_PASSWORD: {secret: tarjama-db-app, key: app_db_password}
    configs: [{name: bootstrap, path: /configuration}]
    connect: [db]
    resources: {cpu: 100m, memory: 128Mi}
    timeout: 240
  migrate:
    image: "preview.local/atelier/web@sha256:30eb294e540188a985f94f6de2a657681f20a7d5501b26dd0841eb485c19f2a9"
    uid: 10001
    gid: 10001
    args: [migrate]
    env:
      DATABASE_URL_FILE: /run/db/database_url
    secrets: [{name: tarjama-db-app, path: /run/db}]
    connect: [db]
    resources: {cpu: 250m, memory: 256Mi}
    timeout: 300
volumes:
  library: {size: 14Gi}
  database: {size: 2Gi}
configs:
  postgres-client:
    pg_service.conf: "[preview-init]\nhost=/tmp\n"
  bootstrap:
    bootstrap-db.sh: "#!/bin/sh\nset -eu\n# Explicit job; no secrets in command arguments or output.\nexport PGCONNECT_TIMEOUT=2\nattempt=0\nuntil psql -X -w --set ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; do\n  attempt=$((attempt + 1))\n  if [ \"$attempt\" -ge 45 ]; then\n    echo 'PostgreSQL unavailable after bounded startup wait' >&2\n    exit 1\n  fi\n  sleep 2\ndone\npsql -X -w --set ON_ERROR_STOP=1 <<'SQL'\n\\getenv app_password APP_DB_PASSWORD\nBEGIN;\nSELECT pg_advisory_xact_lock(91372611);\nSELECT 'CREATE ROLE tarjama LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE'\nWHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tarjama')\n\\gexec\nALTER ROLE tarjama LOGIN PASSWORD :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;\nALTER DATABASE tarjama OWNER TO tarjama;\nGRANT USAGE, CREATE ON SCHEMA public TO tarjama;\nCOMMIT;\nSQL\n"
