volumes:
  library:
    size: 14Gi
  database:
    size: 2Gi
  identity-database:
    size: 2Gi
  identity-backups:
    size: 1Gi
configs:
  postgres-client:
    pg_service.conf: '[preview-init]

      host=/tmp

      '
  deploy-backup:
    backup.sh: "#!/bin/sh\nset -eu\numask 077\nexport PGHOST=pv-db PGPORT=5432 PGDATABASE=tarjama\
      \ PGUSER=tarjama PGCONNECT_TIMEOUT=3\nexport PGPASSWORD=\"$(cat /run/db/app_db_password)\"\
      \nfor attempt in $(seq 1 30); do\n  if psql -X -w -Atqc 'SELECT 1' >/dev/null\
      \ 2>/tmp/db-ready.err; then break; fi\n  sleep 2\ndone\npsql -X -w -Atqc 'SELECT\
      \ 1' >/dev/null\nmkdir -p /storage/backups\nout=/storage/backups/pre-reliability-$(date\
      \ -u +%Y%m%dT%H%M%SZ).dump\nset -C\n: > \"$out\"\nset +C\npg_dump -w -Fc > \"\
      $out\"\npg_restore --list \"$out\" >/dev/null\nsha256sum \"$out\"\nprintf 'Backup\
      \ complete; no media modified.\\n'\n"
    identity-backup.sh: "#!/bin/sh\nset -eu\numask 077\nexport PGHOST=pv-authdb PGPORT=5432\
      \ PGDATABASE=keycloak PGUSER=keycloak PGCONNECT_TIMEOUT=3\nPGPASSWORD=$(cat\
      \ /run/keycloak-db/password)\nexport PGPASSWORD\nfor attempt in $(seq 1 30);\
      \ do\n  if psql -X -w -Atqc 'SELECT 1' >/dev/null 2>/tmp/authdb-ready.err; then\
      \ break; fi\n  sleep 2\ndone\npsql -X -w -Atqc 'SELECT 1' >/dev/null\nmkdir\
      \ -p /identity-backups/dumps\nout=/identity-backups/dumps/keycloak-$(date -u\
      \ +%Y%m%dT%H%M%SZ).dump\n# A failed dump is never published as a completed backup.\n\
      set -C\n: > \"$out.partial\"\nset +C\npg_dump -w -Fc > \"$out.partial\"\npg_restore\
      \ --list \"$out.partial\" >/dev/null\nmv \"$out.partial\" \"$out\"\nsha256sum\
      \ \"$out\"\nprintf 'Keycloak backup complete. Off-host copy and restore verification\
      \ still required.\\n'\n"
  keycloak-realm:
    tarjama-realm.json: "{\n  \"realm\": \"tarjama\",\n  \"displayName\": \"Tarjama\"\
      ,\n  \"enabled\": true,\n  \"sslRequired\": \"all\",\n  \"registrationAllowed\"\
      : true,\n  \"registrationEmailAsUsername\": true,\n  \"loginWithEmailAllowed\"\
      : true,\n  \"duplicateEmailsAllowed\": false,\n  \"verifyEmail\": false,\n \
      \ \"resetPasswordAllowed\": false,\n  \"editUsernameAllowed\": false,\n  \"\
      rememberMe\": false,\n  \"bruteForceProtected\": true,\n  \"permanentLockout\"\
      : false,\n  \"failureFactor\": 5,\n  \"waitIncrementSeconds\": 60,\n  \"maxFailureWaitSeconds\"\
      : 900,\n  \"ssoSessionIdleTimeout\": 86400,\n  \"ssoSessionMaxLifespan\": 86400,\n\
      \  \"accessTokenLifespan\": 300,\n  \"accessCodeLifespan\": 60,\n  \"accessCodeLifespanUserAction\"\
      : 600,\n  \"passwordPolicy\": \"length(12) and notUsername(undefined) and notEmail(undefined)\"\
      ,\n  \"internationalizationEnabled\": true,\n  \"supportedLocales\": [\n   \
      \ \"fr\",\n    \"en\"\n  ],\n  \"defaultLocale\": \"fr\",\n  \"clients\": [\n\
      \    {\n      \"clientId\": \"tarjama-web\",\n      \"name\": \"Tarjama\",\n\
      \      \"enabled\": true,\n      \"protocol\": \"openid-connect\",\n      \"\
      publicClient\": false,\n      \"clientAuthenticatorType\": \"client-secret\"\
      ,\n      \"secret\": \"${TARJAMA_OIDC_SECRET}\",\n      \"standardFlowEnabled\"\
      : true,\n      \"implicitFlowEnabled\": false,\n      \"directAccessGrantsEnabled\"\
      : false,\n      \"serviceAccountsEnabled\": false,\n      \"fullScopeAllowed\"\
      : false,\n      \"redirectUris\": [\n        \"${TARJAMA_PUBLIC_ORIGIN}/auth/callback\"\
      \n      ],\n      \"webOrigins\": [\n        \"${TARJAMA_PUBLIC_ORIGIN}\"\n\
      \      ],\n      \"defaultClientScopes\": [\n        \"profile\",\n        \"\
      email\"\n      ],\n      \"attributes\": {\n        \"pkce.code.challenge.method\"\
      : \"S256\",\n        \"post.logout.redirect.uris\": \"${TARJAMA_PUBLIC_ORIGIN}/\"\
      ,\n        \"backchannel.logout.url\": \"${TARJAMA_BACKCHANNEL_URL}\",\n   \
      \     \"backchannel.logout.session.required\": \"true\",\n        \"backchannel.logout.revoke.offline.tokens\"\
      : \"true\"\n      }\n    }\n  ],\n  \"requiredCredentials\": [\n    \"password\"\
      \n  ],\n  \"requiredActions\": [\n    {\n      \"alias\": \"UPDATE_PASSWORD\"\
      ,\n      \"name\": \"UPDATE_PASSWORD\",\n      \"providerId\": \"UPDATE_PASSWORD\"\
      ,\n      \"enabled\": true,\n      \"defaultAction\": false,\n      \"priority\"\
      : 0\n    },\n    {\n      \"alias\": \"UPDATE_PROFILE\",\n      \"name\": \"\
      UPDATE_PROFILE\",\n      \"providerId\": \"UPDATE_PROFILE\",\n      \"enabled\"\
      : false,\n      \"defaultAction\": false,\n      \"priority\": 1\n    },\n \
      \   {\n      \"alias\": \"VERIFY_PROFILE\",\n      \"name\": \"VERIFY_PROFILE\"\
      ,\n      \"providerId\": \"VERIFY_PROFILE\",\n      \"enabled\": false,\n  \
      \    \"defaultAction\": false,\n      \"priority\": 2\n    },\n    {\n     \
      \ \"alias\": \"VERIFY_EMAIL\",\n      \"name\": \"VERIFY_EMAIL\",\n      \"\
      providerId\": \"VERIFY_EMAIL\",\n      \"enabled\": false,\n      \"defaultAction\"\
      : false,\n      \"priority\": 3\n    }\n  ]\n}\n"
  keycloak-db-client:
    pg_service.conf: '[keycloak-init]

      host=/tmp

      '
  keycloak-db-init:
    10-keycloak.sh: '#!/bin/sh

      set -eu

      KC_DATABASE_PASSWORD=$(cat /run/keycloak-db/password)

      export KC_DATABASE_PASSWORD

      : "${KC_DATABASE_PASSWORD:?identity DB role password required}"

      # Runs only on the first start of this dedicated PostgreSQL volume.

      psql -X -v ON_ERROR_STOP=1 --host /tmp --username postgres --dbname postgres
      <<''SQL''

      \getenv role_password KC_DATABASE_PASSWORD

      CREATE ROLE keycloak LOGIN PASSWORD :''role_password'' NOSUPERUSER NOCREATEDB
      NOCREATEROLE;

      CREATE DATABASE keycloak OWNER keycloak;

      REVOKE ALL ON DATABASE keycloak FROM PUBLIC;

      SQL

      '
