  bootstrap:
    bootstrap-db.sh: "#!/bin/sh\nset -eu\n# Explicit job; no secrets in command arguments\
      \ or output.\nexport PGCONNECT_TIMEOUT=2\nattempt=0\nuntil psql -X -w --set\
      \ ON_ERROR_STOP=1 -Atqc 'SELECT 1' >/dev/null 2>&1; do\n  attempt=$((attempt\
      \ + 1))\n  if [ \"$attempt\" -ge 45 ]; then\n    echo 'PostgreSQL unavailable\
      \ after bounded startup wait' >&2\n    exit 1\n  fi\n  sleep 2\ndone\npsql -X\
      \ -w --set ON_ERROR_STOP=1 <<'SQL'\n\\getenv app_password APP_DB_PASSWORD\n\
      BEGIN;\nSELECT pg_advisory_xact_lock(91372611);\nSELECT 'CREATE ROLE tarjama\
      \ LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE'\nWHERE NOT EXISTS (SELECT 1 FROM\
      \ pg_roles WHERE rolname = 'tarjama')\n\\gexec\nALTER ROLE tarjama LOGIN PASSWORD\
      \ :'app_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;\n\
      ALTER DATABASE tarjama OWNER TO tarjama;\nGRANT USAGE, CREATE ON SCHEMA public\
      \ TO tarjama;\nCOMMIT;\nSQL\n"
  ui-recording:
    record.mjs: "import {expect} from '@playwright/test';\nimport fs from 'node:fs/promises';\n\
      import {browser,root,proxy,sleep,artifacts,outcomes,upload,devices} from './record-support.mjs';\n\
      for(const device of devices){\n const {name,...options}=device;\n const context=await\
      \ browser.newContext({...options,baseURL:'http://127.0.0.1:8090',acceptDownloads:true,recordVideo:{dir:root,size:device.viewport}\
      \ });\n const page=await context.newPage();page.setDefaultTimeout(20000);\n\
      \ const errors=[];page.on('pageerror',e=>errors.push(e.message));\n let previousStatus='';\n\
      \ page.on('response',async response=>{\n  if(response.request().method()!=='GET'||!\
      \ /\\/api\\/projects\\/[^/]+$/.test(response.url())||response.status()!==200)return;\n\
      \  try{\n   const data=await response.json();\n   const status=JSON.stringify({stage:data.project.stage,duration_ms:data.project.duration_ms,segments:data.project.segments.length,jobs:data.jobs.filter(j=>j.state!=='succeeded').map(j=>({kind:j.kind,state:j.state,progress:j.progress}))});\n\
      \   if(status!==previousStatus){console.log('PROGRESS '+name+' '+status);previousStatus=status;}\n\
      \  }catch{}\n });\n let step='start'; const started=Date.now();\n const mark=async\
      \ label=>{\n   step=label;console.log('STEP '+name+' '+label+' '+new Date().toISOString());\n\
      \   await sleep(800);\n   if(!await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth))throw\
      \ Error('Horizontal overflow at '+label);\n   const path=`${root}/${name}-${label}.png`;await\
      \ page.screenshot({path});await upload(path,`${name}-${label}.png`);await fs.unlink(path);\n\
      \ };\n try {\n  await page.goto('/');\n  await page.getByRole('button',{name:'Compte\
      \ test alice'}).click();\n  await expect(page.getByRole('heading',{name:'Mes\
      \ projets'})).toBeVisible();\n  await mark('library');\n  await page.getByRole('button',{name:'+\
      \ Nouvelle vidéo'}).click();\n  const title=`France 24 · ${name} · ${new Date().toISOString().slice(11,19)}`;\n\
      \  await page.getByLabel('Titre',{exact:true}).fill(title);\n  await page.getByLabel('Lien\
      \ YouTube').fill('https://www.youtube.com/watch?v=b1MKJ5gHig0');\n  await mark('youtube');\n\
      \  await page.getByRole('button',{name:'Commencer',exact:true}).click();\n \
      \ await mark('preparing');\n  // Observe actual persistent queue; never fake\
      \ success or bypass provider cooldown.\n  await expect(page.getByRole('button',{name:'Terminer\
      \ la correction arabe · Traduire',exact:true})).toBeVisible({timeout:18*60000});\n\
      \  await page.getByRole('heading',{name:'Correction arabe',exact:true}).scrollIntoViewIfNeeded();\n\
      \  await mark('arabic');\n  const follow=page.getByRole('button',{name:'Suivi\
      \ activé',exact:true});\n  await expect(follow).toHaveAttribute('aria-pressed','true');\n\
      \  await page.getByRole('button',{name:'Lecture',exact:true}).click();await\
      \ sleep(7000);\n  await page.mouse.wheel(0,700);await sleep(1000);\n  await\
      \ expect(follow).toHaveAttribute('aria-pressed','true');\n  await page.getByRole('button',{name:'Pause',exact:true}).click();\n\
      \  const slider=page.getByRole('slider',{name:'Position de lecture'});\n  const\
      \ duration=Number(await slider.getAttribute('max'));\n  await slider.fill(String(Math.round(duration*.45*10)/10));await\
      \ sleep(1500);\n  await expect(page.locator('.segment.active')).toBeVisible();\n\
      \  await mark('seek-follow');\n  await follow.click();await expect(page.getByRole('button',{name:'Suivi\
      \ désactivé'})).toHaveAttribute('aria-pressed','false');\n  await page.getByRole('button',{name:'Suivi\
      \ désactivé'}).click();\n  const arabic=page.locator('textarea[lang=\"ar\"]').first();\n\
      \  const originalArabic=await arabic.inputValue();\n  const editedArabic=originalArabic.endsWith('.')?originalArabic.slice(0,-1):originalArabic+'.';\n\
      \  if(editedArabic===originalArabic)throw Error('Arabic edit must change the\
      \ text');\n  await arabic.fill(editedArabic);await arabic.blur();\n  await expect(page.locator('.page-title\
      \ [role=\"status\"]')).toContainText('Enregistré');\n  await page.reload();await\
      \ page.getByRole('button',{name:new RegExp(title.replace(/[.*+?^${}()|[\\]\\\
      \\]/g,'\\\\$&'))}).click();\n  await expect(page.locator('textarea[lang=\"ar\"\
      ]').first()).toHaveValue(editedArabic);\n  await mark('saved');\n  await page.getByRole('button',{name:'Terminer\
      \ la correction arabe · Traduire',exact:true}).click();\n  await expect(page.getByRole('button',{name:'Terminer\
      \ la relecture',exact:true})).toBeVisible({timeout:18*60000});\n  await page.getByRole('heading',{name:'Relire\
      \ arabe et français'}).scrollIntoViewIfNeeded();\n  await mark('translation');\n\
      \  const french=page.locator('textarea[lang=\"fr\"]').first();\n  const originalFrench=await\
      \ french.inputValue();\n  const editedFrench=originalFrench.endsWith('.')?originalFrench.slice(0,-1):originalFrench+'.';\n\
      \  if(editedFrench===originalFrench)throw Error('French edit must change the\
      \ text');\n  await french.fill(editedFrench);\n  // Advancing must flush the\
      \ focused edit before exporting.\n  await page.getByRole('button',{name:'Terminer\
      \ la relecture',exact:true}).click();\n  await expect(page.getByRole('heading',{name:'Votre\
      \ vidéo sous-titrée'})).toBeVisible();\n  await page.reload();\n  await page.getByRole('button',{name:new\
      \ RegExp(title.replace(/[.*+?^${}()|[\\]\\\\]/g,'\\\\$&'))}).click();\n  await\
      \ expect(page.locator('textarea[lang=\"fr\"]').first()).toHaveValue(editedFrench);\n\
      \  await page.getByRole('combobox',{name:/Qualité/}).selectOption('high');\n\
      \  for(const [track,label] of [['fr','français'],['ar','arabe']]) {\n   await\
      \ page.getByRole('combobox',{name:/Sous-titres/}).selectOption(track);\n   await\
      \ mark('export-'+track);\n   await page.getByRole('button',{name:'Créer la vidéo',exact:true}).click();\n\
      \   const link=page.getByRole('link',{name:`Télécharger · High · ${label}`,exact:true});\n\
      \   await expect(link).toBeVisible({timeout:12*60000});\n   const pending=page.waitForEvent('download',{timeout:60000});await\
      \ link.click();const download=await pending;\n   const filename=`tarjama-b1MKJ5gHig0-${name}-${track}-high.mp4`;\n\
      \   const path=root+'/'+filename;await download.saveAs(path);await upload(path,filename);await\
      \ fs.unlink(path);await download.delete();\n   await mark('downloaded-'+track);\n\
      \  }\n  for (const track of ['fr','ar']) {\n   const filename=`tarjama-b1MKJ5gHig0-${name}-${track}-high.mp4`;\n\
      \   await page.goto('/review-artifacts/'+filename);\n   const rendered=page.locator('video');\n\
      \   await expect(rendered).toBeVisible();\n   await rendered.evaluate(async\
      \ v=>{v.muted=true;await v.play();});\n   await sleep(4000);\n   await rendered.evaluate(v=>v.pause());\n\
      \   await mark('rendered-'+track);\n   await rendered.evaluate(async v=>{v.currentTime=v.duration*.5;await\
      \ v.play();});\n   await sleep(4000);await rendered.evaluate(v=>v.pause());\n\
      \   await mark('rendered-middle-'+track);\n  }\n  if(errors.length)throw Error('Browser\
      \ errors: '+errors.join('; '));\n  outcomes.push({device:name,viewport:device.viewport,engine:'Chromium',status:'passed',elapsedSeconds:Math.round((Date.now()-started)/1000)});\n\
      \ }catch(e){\n  outcomes.push({device:name,status:'failed',step,error:String(e),elapsedSeconds:Math.round((Date.now()-started)/1000)});\n\
      \  console.log('FAIL '+JSON.stringify(outcomes.at(-1)));\n  await mark('failure').catch(()=>{});\n\
      \ }finally{\n  const video=page.video();await context.close();\n  if(video){const\
      \ path=await video.path();await upload(path,`parcours-${name}.webm`);await fs.unlink(path);}\n\
      \ }\n console.log('OUTCOME '+JSON.stringify(outcomes.at(-1)));\n if(outcomes.at(-1).status==='failed')break;\n\
      }\nconst manifest={sourceVideo:'https://www.youtube.com/watch?v=b1MKJ5gHig0',identity:'isolated\
      \ test account; production MFA confirmed separately by owner',providers:'real\
      \ Gemini and Groq',media:'administered isolated jobs, WARP for download',emulation:'CSS\
      \ viewports, Chromium; not physical devices or Safari qualification',outcomes,artifacts};\n\
      await fs.writeFile(root+'/manifest.json',JSON.stringify(manifest,null,2));await\
      \ upload(root+'/manifest.json','manifest.json');\nconsole.log('RESULT '+JSON.stringify(manifest));\n\
      await browser.close();proxy.close();\nprocess.exitCode=outcomes.length===3&&outcomes.every(x=>x.status==='passed')?0:1;\n"
    record-support.mjs: "// Real UI journeys. No provider/API fixtures, Kubernetes\
      \ credentials or app secrets.\nimport { chromium, expect } from '@playwright/test';\n\
      import http from 'node:http';\nimport fs from 'node:fs/promises';\nimport {\
      \ createReadStream } from 'node:fs';\nimport { createHash } from 'node:crypto';\n\
      const upstream = 'http://pv-review:8095';\nconst root = '/tmp/recordings';\n\
      await fs.mkdir(root, {recursive:true});\nconst sleep = ms => new Promise(resolve\
      \ => setTimeout(resolve,ms));\nfor(let attempt=0;;attempt++) {\n  try { const\
      \ response=await fetch(upstream+'/readyz'); if(response.status===204)break;\
      \ } catch {}\n  if(attempt===59)throw Error('Private review unavailable after\
      \ bounded wait');\n  await sleep(1000);\n}\nconst proxy=http.createServer((req,res)=>{\n\
      \  const target=http.request(upstream+req.url,{method:req.method,headers:req.headers},response=>{\n\
      \    res.writeHead(response.statusCode,response.headers);response.pipe(res);\n\
      \  });target.on('error',()=>{res.writeHead(502);res.end();});req.pipe(target);\n\
      });\nawait new Promise(resolve=>proxy.listen(8090,'127.0.0.1',resolve));\nconst\
      \ browser=await chromium.launch({executablePath:'/usr/bin/chromium',args:['--no-sandbox','--disable-dev-shm-usage'],slowMo:180});\n\
      const artifacts=[];const outcomes=[];\nasync function upload(path,name) {\n\
      \ const stat=await fs.stat(path);const hash=createHash('sha256');\n for await\
      \ (const chunk of createReadStream(path))hash.update(chunk);\n const response=await\
      \ fetch(upstream+'/review-artifacts/'+name,{method:'PUT',body:createReadStream(path),duplex:'half'});\n\
      \ if(!response.ok)throw Error('Artifact persistence HTTP '+response.status);\n\
      \ artifacts.push({name,bytes:stat.size,sha256:hash.digest('hex')});\n if(/\\\
      .(mp4|webm)$/.test(name))console.log('ARTIFACT '+JSON.stringify(artifacts.at(-1)));\n\
      }\nconst devices=[\n {name:'macbook-air15-m4',viewport:{width:1440,height:932},deviceScaleFactor:2,isMobile:false,hasTouch:false},\n\
      \ {name:'pixel6',viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true},\n\
      \ {name:'iphone15',viewport:{width:393,height:852},deviceScaleFactor:3,isMobile:true,hasTouch:true},\n\
      ];\n\nexport {browser,root,proxy,sleep,artifacts,outcomes,upload,devices};\n"
