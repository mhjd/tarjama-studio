  deploy-backup:
    backup.sh: "#!/bin/sh\nset -eu\numask 077\nexport PGHOST=pv-db PGPORT=5432 PGDATABASE=tarjama\
      \ PGUSER=tarjama PGCONNECT_TIMEOUT=3\nexport PGPASSWORD=\"$(cat /run/db/app_db_password)\"\
      \nfor attempt in $(seq 1 30); do\n  if psql -X -w -Atqc 'SELECT 1' >/dev/null\
      \ 2>/tmp/db-ready.err; then break; fi\n  sleep 2\ndone\npsql -X -w -Atqc 'SELECT\
      \ 1' >/dev/null\nmkdir -p /storage/backups\nout=/storage/backups/pre-ten-minute-1b443ec-$(date\
      \ -u +%Y%m%dT%H%M%SZ).dump\nset -C\n: > \"$out\"\nset +C\npg_dump -w -Fc > \"\
      $out\"\npg_restore --list \"$out\" >/dev/null\nsha256sum \"$out\"\nprintf 'Backup\
      \ complete; no media modified.\\n'\n"
  ui-recording:
    record.mjs: "import {exportAndInspect} from './record-export.mjs';\nimport {expect}\
      \ from '@playwright/test';\nimport fs from 'node:fs/promises';\nimport {browser,root,proxy,sleep,artifacts,outcomes,upload,devices}\
      \ from './record-support.mjs';\nconst sourceVideo=process.env.REVIEW_VIDEO;\n\
      if(!sourceVideo||!/^https:\\/\\/www.youtube.com\\/watch\\?v=[A-Za-z0-9_-]{11}$/.test(sourceVideo))throw\
      \ Error('Explicit canonical YouTube URL required');\nconst selectedDevices=devices.filter(d=>d.name===process.env.REVIEW_DEVICE);\n\
      if(selectedDevices.length!==1)throw Error('One device per isolated review run\
      \ required');\nconst videoID=new URL(sourceVideo).searchParams.get('v');\nfor(const\
      \ device of selectedDevices){\n const {name,...options}=device;\n const context=await\
      \ browser.newContext({...options,baseURL:'http://127.0.0.1:8090',acceptDownloads:true,recordVideo:{dir:root,size:device.viewport}\
      \ });\n const page=await context.newPage();page.setDefaultTimeout(20000);\n\
      \ const errors=[];page.on('pageerror',e=>errors.push(e.message));\n let previousStatus='',terminalFailure='';\n\
      \ const waitReady=async locator=>{\n  const deadline=Date.now()+30*60000;\n\
      \  while(Date.now()<deadline){\n   if(terminalFailure)throw Error(terminalFailure);\n\
      \   if(await locator.isVisible())return;\n   await sleep(2000);\n  }\n  throw\
      \ Error('Bounded wait exhausted at '+step);\n };\n page.on('response',async\
      \ response=>{\n  if(response.request().method()!=='GET'||! /\\/api\\/projects\\\
      /[^/]+$/.test(response.url())||response.status()!==200)return;\n  try{\n   const\
      \ data=await response.json();\n   const failure=data.jobs.find(j=>j.state==='failed');\n\
      \   if(failure)terminalFailure='Real job failed: '+failure.kind+' at '+failure.progress+'%';\n\
      \   const status=JSON.stringify({stage:data.project.stage,duration_ms:data.project.duration_ms,segments:data.project.segments.length,jobs:data.jobs.filter(j=>j.state!=='succeeded').map(j=>({kind:j.kind,state:j.state,progress:j.progress}))});\n\
      \   if(status!==previousStatus){console.log('PROGRESS '+name+' '+data.project.stage+'\
      \ '+data.jobs.filter(j=>j.state!=='succeeded').map(j=>j.kind+':'+j.state+':'+j.progress).join('\
      \ '));previousStatus=status;}\n  }catch{}\n });\n let step='start'; const started=Date.now();\n\
      \ const mark=async label=>{\n   step=label;console.log('STEP '+name+' '+label+'\
      \ '+new Date().toISOString());\n   await sleep(800);\n   if(!await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth))throw\
      \ Error('Horizontal overflow at '+label);\n   const path=`${root}/${name}-${label}.png`;await\
      \ page.screenshot({path});await upload(path,`${name}-${label}.png`);await fs.unlink(path);\n\
      \ };\n try {\n  await page.goto('/');\n  await page.getByRole('button',{name:'Compte\
      \ test alice'}).click();\n  await expect(page.getByRole('heading',{name:'Mes\
      \ projets'})).toBeVisible();\n  await mark('library');\n  await page.getByRole('button',{name:'+\
      \ Nouvelle vidéo'}).click();\n  const title=`Qualification · ${name} · ${new\
      \ Date().toISOString().slice(11,19)}`;\n  await page.getByLabel('Titre',{exact:true}).fill(title);\n\
      \  await page.getByLabel('Lien YouTube').fill(sourceVideo);\n  await mark('youtube');\n\
      \  await page.getByRole('button',{name:'Commencer',exact:true}).click();\n \
      \ await mark('preparing');\n  await expect(page.getByRole('button',{name:'3.\
      \ Traduire',exact:true})).toBeDisabled();\n  await expect(page.getByRole('button',{name:'4.\
      \ Exporter',exact:true})).toBeDisabled();\n  await expect(page.locator('textarea[lang=\"\
      ar\"]')).toHaveCount(0);\n  await waitReady(page.getByRole('button',{name:'Valider\
      \ et traduire',exact:true}).first());\n  await page.getByRole('heading',{name:'Correction\
      \ arabe',exact:true}).scrollIntoViewIfNeeded();\n  await mark('arabic');\n \
      \ const follow=page.getByRole('button',{name:'Suivi activé',exact:true});\n\
      \  await expect(follow).toHaveAttribute('aria-pressed','true');\n  await page.getByRole('button',{name:'Lecture',exact:true}).click();await\
      \ sleep(7000);\n  await page.mouse.wheel(0,700);await sleep(1000);\n  await\
      \ expect(follow).toHaveAttribute('aria-pressed','true');\n  await page.getByRole('button',{name:'Pause',exact:true}).click();\n\
      \  const slider=page.getByRole('slider',{name:'Position de lecture'});\n  const\
      \ duration=Number(await slider.getAttribute('max'));\n  await slider.fill(String(Math.round(duration*.45*10)/10));await\
      \ sleep(1500);\n  await expect(page.locator('.segment.active')).toBeVisible();\n\
      \  await mark('seek-follow');\n  await follow.click();await expect(page.getByRole('button',{name:'Suivi\
      \ désactivé'})).toHaveAttribute('aria-pressed','false');\n  await page.getByRole('button',{name:'Suivi\
      \ désactivé'}).click();\n  const arabic=page.locator('textarea[lang=\"ar\"]').first();\n\
      \  const originalArabic=await arabic.inputValue();\n  const editedArabic=originalArabic.endsWith('.')?originalArabic.slice(0,-1):originalArabic+'.';\n\
      \  if(editedArabic===originalArabic)throw Error('Arabic edit must change the\
      \ text');\n  await arabic.fill(editedArabic);await arabic.blur();\n  await expect(page.locator('.page-title\
      \ [role=\"status\"]')).toContainText('Enregistré');\n  await page.reload();\n\
      \  await expect(page.locator('textarea[lang=\"ar\"]').first()).toHaveValue(editedArabic);\n\
      \  await mark('saved');\n  await page.getByRole('button',{name:'Valider et traduire',exact:true}).first().click();\n\
      \  await expect(page).toHaveURL(/\\/traduire$/);\n  await expect(page.locator('textarea[lang=\"\
      ar\"],textarea[lang=\"fr\"]')).toHaveCount(0);\n  await expect(page.getByRole('button',{name:'4.\
      \ Exporter',exact:true})).toBeDisabled();\n  await expect(page.getByRole('button',{name:'2.\
      \ Corriger',exact:true})).toBeEnabled();\n  await expect.poll(()=>page.evaluate(()=>scrollY)).toBe(0);\n\
      \  await mark('translating');\n  await waitReady(page.getByRole('button',{name:'Valider\
      \ et exporter',exact:true}).first());\n  await page.getByRole('heading',{name:'Relire\
      \ arabe et français'}).scrollIntoViewIfNeeded();\n  await mark('translation');\n\
      \  const french=page.locator('textarea[lang=\"fr\"]').first();\n  const originalFrench=await\
      \ french.inputValue();\n  const editedFrench=originalFrench.endsWith('.')?originalFrench.slice(0,-1):originalFrench+'.';\n\
      \  if(editedFrench===originalFrench)throw Error('French edit must change the\
      \ text');\n  await french.fill(editedFrench);\n  await page.getByRole('button',{name:'Valider\
      \ et exporter',exact:true}).first().click();\n  await expect(page.getByRole('heading',{name:'Votre\
      \ vidéo sous-titrée'})).toBeVisible();\n  await page.reload();\n  await page.getByRole('button',{name:'3.\
      \ Traduire',exact:true}).click();\n  await expect(page.locator('textarea[lang=\"\
      fr\"]').first()).toHaveValue(editedFrench);\n  await page.getByRole('button',{name:'4.\
      \ Exporter',exact:true}).click();\n  await exportAndInspect(page,mark,waitReady,videoID,name);\n\
      \  if(errors.length)throw Error('Browser errors: '+errors.join('; '));\n  outcomes.push({device:name,viewport:device.viewport,engine:'Chromium',status:'passed',elapsedSeconds:Math.round((Date.now()-started)/1000)});\n\
      \ }catch(e){\n  outcomes.push({device:name,status:'failed',step,error:String(e),elapsedSeconds:Math.round((Date.now()-started)/1000)});\n\
      \  console.log('FAIL '+JSON.stringify(outcomes.at(-1)));\n  await mark('failure').catch(()=>{});\n\
      \ }finally{\n  const video=page.video();await context.close();\n  if(video){const\
      \ path=await video.path();await upload(path,`parcours-${name}.webm`);await fs.unlink(path);}\n\
      \ }\n console.log('OUTCOME '+JSON.stringify(outcomes.at(-1)));\n if(outcomes.at(-1).status==='failed')break;\n\
      }\nconst manifest={sourceVideo,identity:'isolated test account; production MFA\
      \ confirmed separately by owner',providers:'real OpenRouter/DeepSeek with Parallel\
      \ and Groq',media:'administered isolated jobs, WARP for download',emulation:'CSS\
      \ viewports, Chromium; not physical devices or Safari qualification',outcomes,artifacts};\n\
      await fs.writeFile(root+'/manifest.json',JSON.stringify(manifest,null,2));await\
      \ upload(root+'/manifest.json','manifest.json');\nconsole.log('RESULT '+JSON.stringify({outcomes,artifacts:artifacts.filter(x=>/\\\
      .(mp4|webm)$/.test(x.name))}));\nawait browser.close();proxy.close();\nprocess.exitCode=outcomes.length===selectedDevices.length&&outcomes.every(x=>x.status==='passed')?0:1;\n"
    record-support.mjs: "// Real UI journeys. No provider/API fixtures, Kubernetes\
      \ credentials or app secrets.\nimport { chromium, expect } from '@playwright/test';\n\
      import http from 'node:http';\nimport fs from 'node:fs/promises';\nimport {\
      \ createReadStream } from 'node:fs';\nimport { createHash } from 'node:crypto';\n\
      const upstream = 'http://pv-review:8095';\nconst root = '/tmp/recordings';\n\
      await fs.mkdir(root, {recursive:true});\nconst sleep = ms => new Promise(resolve\
      \ => setTimeout(resolve,ms));\nfor(let attempt=0;;attempt++) {\n  try { const\
      \ response=await fetch(upstream+'/readyz'); if(response.status===204)break;\
      \ } catch {}\n  if(attempt===59)throw Error('Private review unavailable after\
      \ bounded wait');\n  await sleep(1000);\n}\nconst proxy=http.createServer((req,res)=>{\n\
      \  const target=http.request(upstream+req.url,{method:req.method,headers:req.headers},response=>{\n\
      \    res.writeHead(response.statusCode,response.headers);response.pipe(res);\n\
      \  });target.on('error',()=>{res.writeHead(502);res.end();});req.pipe(target);\n\
      });\nawait new Promise(resolve=>proxy.listen(8090,'127.0.0.1',resolve));\nconst\
      \ browser=await chromium.launch({executablePath:'/usr/bin/chromium',args:['--no-sandbox','--disable-dev-shm-usage'],slowMo:180});\n\
      const artifacts=[];const outcomes=[];\nasync function upload(path,name) {\n\
      \ const stat=await fs.stat(path);const hash=createHash('sha256');\n for await\
      \ (const chunk of createReadStream(path))hash.update(chunk);\n const response=await\
      \ fetch(upstream+'/review-artifacts/'+name,{method:'PUT',body:createReadStream(path),duplex:'half'});\n\
      \ if(!response.ok)throw Error('Artifact persistence HTTP '+response.status);\n\
      \ artifacts.push({name,bytes:stat.size,sha256:hash.digest('hex')});\n if(/\\\
      .(mp4|webm)$/.test(name))console.log('ARTIFACT '+JSON.stringify(artifacts.at(-1)));\n\
      }\nconst devices=[\n {name:'macbook-air15-m4',viewport:{width:1440,height:932},deviceScaleFactor:2,isMobile:false,hasTouch:false},\n\
      \ {name:'pixel6',viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true},\n\
      \ {name:'iphone15',viewport:{width:393,height:852},deviceScaleFactor:3,isMobile:true,hasTouch:true},\n\
      ];\n\nexport {browser,root,proxy,sleep,artifacts,outcomes,upload,devices};\n"
    record-export.mjs: "import {expect} from '@playwright/test';\nimport fs from 'node:fs/promises';\n\
      import {root,sleep,upload} from './record-support.mjs';\nexport async function\
      \ exportAndInspect(page,mark,waitReady,videoID,name){\n  await page.getByRole('combobox',{name:/Qualité/}).selectOption('high');\n\
      \  const projectID=new URL(page.url()).pathname.split('/')[2];\n  const result=await\
      \ page.request.get('/api/projects/'+projectID);\n  if(!result.ok())throw Error('Cannot\
      \ verify final transcript');\n  const {project}=await result.json();\n  const\
      \ transcript={source:project.url,duration_ms:project.duration_ms,segments:project.segments};\n\
      \  const transcriptName=`transcription-${name}.json`;\n  await fs.writeFile(root+'/'+transcriptName,JSON.stringify(transcript,null,2));\n\
      \  await upload(root+'/'+transcriptName,transcriptName);\n  const indexes=[0,1,Math.floor(project.segments.length/2),project.segments.length-2,project.segments.length-1];\n\
      \  console.log('TRANSLATION_SAMPLE '+JSON.stringify({duration_ms:project.duration_ms,segments:indexes.map(i=>project.segments[i])}));\n\
      \  for(const [track,label] of [['fr','français']]) {\n   await mark('export-'+track);\n\
      \   await page.getByRole('button',{name:'Créer la vidéo',exact:true}).click();\n\
      \   const link=page.getByRole('link',{name:`Télécharger · High · ${label}`,exact:true});\n\
      \   await waitReady(link);\n   const pending=page.waitForEvent('download',{timeout:60000});await\
      \ link.click();const download=await pending;\n   const filename=`tarjama-${videoID}-${name}-${track}-high.mp4`;\n\
      \   const path=root+'/'+filename;await download.saveAs(path);await upload(path,filename);await\
      \ fs.unlink(path);await download.delete();\n   await mark('downloaded-'+track);\n\
      \  }\n  for (const track of ['fr']) {\n   const filename=`tarjama-${videoID}-${name}-${track}-high.mp4`;\n\
      \   await page.goto('/review-artifacts/'+filename);\n   const rendered=page.locator('video');\n\
      \   await expect(rendered).toBeVisible();\n   await rendered.evaluate(async\
      \ v=>{v.muted=true;await v.play();});\n   await sleep(4000);\n   await rendered.evaluate(v=>v.pause());\n\
      \   const decoded=await rendered.evaluate(v=>({duration:v.duration,width:v.videoWidth,height:v.videoHeight,frames:v.getVideoPlaybackQuality().totalVideoFrames}));\n\
      \   if(Math.abs(decoded.duration-project.duration_ms/1000)>.5||decoded.width<=0||decoded.height<=0||decoded.frames<=0)throw\
      \ Error('Export duration or video decoding mismatch');\n   await mark('rendered-'+track);\n\
      \   await rendered.evaluate(async v=>{v.currentTime=v.duration*.5;await v.play();});\n\
      \   await sleep(4000);await rendered.evaluate(v=>v.pause());\n   await mark('rendered-middle-'+track);\n\
      \  }\n}\n"
